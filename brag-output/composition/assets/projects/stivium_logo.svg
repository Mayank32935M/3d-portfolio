<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" class="stivium-boot-logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    Stivium boot logo — derived from the existing Stivium hexagon mark
    (six triangular facets around a shared center point at 75,78).
    Each facet is its own <g data-facet="n"> so BootScreen.css can animate
    them independently (scale/opacity/translate) during the assembly phase.
    Facet order roughly matches a clockwise sweep from the top.
  -->
  <g data-facet="1" class="sbl-facet">
    <path d="M75,78 L75,30 L116.6,54 Z" fill="#C3D68E"/>
  </g>
  <g data-facet="2" class="sbl-facet">
    <path d="M75,78 L116.6,54 L116.6,102 Z" fill="#93AC5B"/>
  </g>
  <g data-facet="3" class="sbl-facet">
    <path d="M75,78 L116.6,102 L75,126 Z" fill="#C3D68E"/>
  </g>
  <g data-facet="4" class="sbl-facet">
    <path d="M75,78 L75,126 L33.4,102 Z" fill="#93AC5B"/>
  </g>
  <g data-facet="5" class="sbl-facet">
    <path d="M75,78 L33.4,102 L33.4,54 Z" fill="#C3D68E"/>
  </g>
  <g data-facet="6" class="sbl-facet">
    <path d="M75,78 L33.4,54 L75,30 Z" fill="#93AC5B"/>
  </g>
</svg>
